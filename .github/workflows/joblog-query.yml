name: Repo Cassette job log query probe
on:
  push:
    paths:
      - .github/workflows/joblog-query.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node joblog-query.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

