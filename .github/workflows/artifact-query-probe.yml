name: Repo Cassette artifact query probe
on:
  push:
    paths:
      - artifact-query-probe.mjs
      - .github/workflows/artifact-query-probe.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await import('file://' + process.env.GITHUB_WORKSPACE + '/artifact-query-probe.mjs')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
