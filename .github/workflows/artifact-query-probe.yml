name: Repo Cassette artifact query probe
on:
  push:
    paths:
      - artifact-query-probe.mjs
      - .github/workflows/artifact-query-probe.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node artifact-query-probe.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
