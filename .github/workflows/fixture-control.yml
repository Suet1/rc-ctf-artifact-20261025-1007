name: Repo Cassette fixture control
on:
  push:
    paths:
      - .github/workflows/fixture-control.yml
      - fixture-control/index.mjs
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./fixture-control
        env:
          GITHUB_TOKEN: ${{ github.token }}

