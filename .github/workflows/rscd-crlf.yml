name: Repo Cassette rscd CRLF probe
on:
  push:
    paths:
      - .github/workflows/rscd-crlf.yml
      - rscd-probe/index.mjs
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./rscd-probe
        env:
          GITHUB_TOKEN: ${{ github.token }}

