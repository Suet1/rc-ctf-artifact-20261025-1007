name: Repo Cassette artifact route probe
on:
  push:
    paths:
      - .github/workflows/artifact-routes.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node artifact-routes.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

