name: Upload raw JSON
on:
  push:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          path: payload.json
          archive: false
          retention-days: 1
      - run: echo "artifact_id=${{ steps.upload.outputs.artifact-id }}"
