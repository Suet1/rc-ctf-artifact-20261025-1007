name: Lookup public JSON asset
on:
  push:
    paths:
      - .github/workflows/release_lookup.yml
jobs:
  lookup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Print public ClawSec JSON asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/prompt-security/clawsec/releases/tags/nanoclaw-traffic-guardian-v0.0.2 --jq '.assets[] | select(.name == "checksums.json") | {id, name, content_type, size}'
