name: Step logs version probe
on:
  push:
    paths:
      - .github/workflows/step-logs-version.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./step-logs-version-action
        env:
          GITHUB_TOKEN: ${{ github.token }}

